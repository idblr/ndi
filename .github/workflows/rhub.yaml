# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: "${{ github.event.inputs.id }}: ${{ github.event.inputs.name || format('Manually run by {0}', github.triggering_actor) }}"

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'R-hub platforms (e.g., linux, windows, macos)'
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Optional run name'
        type: string
      id:
        description: 'Optional Unique ID'
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}
    steps:
      - uses: r-hub/actions/setup@v1
        with:
          config: ${{ github.event.inputs.config }}
        id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          
      - name: Install dependencies (automated)
        uses: r-hub/actions/setup-deps@v1
        continue-on-error: true 
        with:
          job-config: ${{ matrix.config.job-config }}

      - name: Force Rcpp fix and DescTools build
        if: always() && contains(matrix.config.label, 'devel')
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e "install.packages('remotes')"
          Rscript -e "remotes::install_github('RcppCore/Rcpp', upgrade = 'never', auth_token = Sys.getenv('GITHUB_PAT'))"
          Rscript -e "install.packages('DescTools', type = 'source', repos = 'https://cloud.r-project.org')"
        shell: bash
        
      - name: Resume remaining dependencies
        if: always() && contains(matrix.config.label, 'devel')
        run: |
          Rscript -e "pak::local_install_dev_deps(upgrade = FALSE)"
        shell: bash
          
      - uses: r-hub/actions/run-check@v1
        if: always()
        with:
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          
      - uses: r-hub/actions/platform-info@v1
        with:
          job-config: ${{ matrix.config.job-config }}

      - name: Install dependencies (automated)
        uses: r-hub/actions/setup-deps@v1
        continue-on-error: true
        with:
          job-config: ${{ matrix.config.job-config }}

      - name: Force Rcpp fix and DescTools build
        if: always() && contains(matrix.config.label, 'devel')
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e "install.packages('remotes')"
          Rscript -e "remotes::install_github('RcppCore/Rcpp', upgrade = 'never', auth_token = Sys.getenv('GITHUB_PAT'))"
          Rscript -e "install.packages('DescTools', type = 'source', repos = 'https://cloud.r-project.org')"
        shell: bash
        
      - name: Resume remaining dependencies
        if: always() && contains(matrix.config.label, 'devel')
        run: |
          Rscript -e "pak::local_install_dev_deps(upgrade = FALSE)"
        shell: bash
          
      - uses: r-hub/actions/run-check@v1
        if: always()
        with:
          job-config: ${{ matrix.config.job-config }}
