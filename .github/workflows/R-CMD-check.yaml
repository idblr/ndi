on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'devel'} # Previous issue with loading 'units' dependency
          - {os: macOS-latest,   r: 'release'}
          - {os: macOS-latest,   r: 'oldrel'}
          - {os: windows-latest, r: 'devel'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'oldrel'}
          - {os: ubuntu-latest,  r: 'devel'} # Potential issue with rlang install
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6

      - uses: r-lib/actions/setup-r@v2 # Node 20 compatible, warnings until r-lib v3
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::rlang
            any::sessionInfo
            
      - name: Session info
        run: |
          options(width = 100)
          sessioninfo::session_info(installed.packages()[, "Package"], include_base = TRUE)
        shell: Rscript {0}
     
   - uses: r-lib/actions/check-r-package@v2
     with:
      upload-snapshots: true
      args: 'c("--no-manual", "--as-cran")'
      error-on: '"warning"'
      check-dir: '"check"'
